name: security-ci
on: [push, pull_request]

jobs:
  appsec:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (mutable tags can be repointed — supply-chain risk).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'   # node:sqlite needs >= 22.5
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # The blocking gate: my six hand-written rules. 0 findings on main, 7 on seed/all-vulns.
      - name: SAST — custom rules (blocking gate)
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --error --config ./semgrep-rules

      # Community packs run for extra coverage but don't fail the build — they're advisory and
      # noisy (they flag things like unpinned action tags), so they inform rather than gate.
      - name: SAST — community packs (informational)
        continue-on-error: true
        run: semgrep scan --config p/typescript --config p/owasp-top-ten

      - name: Dependency audit (SCA)
        # Scope to runtime deps: dev-tooling advisories (esbuild/vite dev-server) never ship.
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security regression tests
        run: npm run test:security

      # --- Stretch: CodeQL (uncomment when you add a query) ---
      # - uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript-typescript
      # - uses: github/codeql-action/analyze@v3

# On `main` the run is GREEN: custom-rule SAST finds 0, tests pass.
# On `seed/all-vulns` the custom-rule SAST and the regression tests go RED on purpose.
# "Same pipeline, red before / green after" is the proof. (The community-packs step is
# informational on both branches.)
